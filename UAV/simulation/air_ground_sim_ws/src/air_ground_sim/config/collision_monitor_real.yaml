collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /ugv/control/cmd_vel
    cmd_vel_out_topic: /ugv/safety/cmd_vel
    state_topic: /ugv/collision_monitor/state
    transform_tolerance: 0.10
    # Sensor loss is itself a stop condition in production.
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone, SlowdownZone, FootprintApproach]
    StopZone:
      type: polygon
      points: [0.78, 0.50, 0.78, -0.50, -0.62, -0.50, -0.62, 0.50]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /ugv/collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: [1.65, 0.85, 1.65, -0.85, -0.78, -0.85, -0.78, 0.85]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: /ugv/collision_monitor/slowdown_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.04
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

lifecycle_manager_collision:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 2.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
    node_names: [collision_monitor]
