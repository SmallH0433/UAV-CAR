# ros_gz_bridge parameter_bridge 配置：R680 仿真话题桥
# QoS 写法参考 air_ground_sim config/deployment_gazebo_bridge.yaml

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# 仿真电机桥输出的整车速度指令 → gz 阿克曼转向插件
- ros_topic_name: /ugv/sim/cmd_vel
  gz_topic_name: /model/ground_vehicle/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# gz 整车里程计 → 仿真电机桥（反算 /motor_feedback）
- ros_topic_name: /ugv/wheel/odometry
  gz_topic_name: /model/ground_vehicle/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# 360° 激光雷达 → perception_node
- ros_topic_name: /scan
  gz_topic_name: /model/ground_vehicle/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# IMU（备用，当前无消费者）
- ros_topic_name: /imu/data
  gz_topic_name: /model/ground_vehicle/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# 前视相机 → perception_node / web_gateway（lazy：有订阅者才启动渲染）
- ros_topic_name: /camera/image_raw
  gz_topic_name: /model/ground_vehicle/front_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

- ros_topic_name: /camera/camera_info
  gz_topic_name: /model/ground_vehicle/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
