action_executor:
  ros__parameters:
    environment: hardware
    flight_use_approved: true
    allow_mode_change: true
    allow_setpoint_output: true
    # Native LAND lets ArduCopter own touchdown and normal auto-disarm.
    allow_landing_disarm_output: true
    allow_disarm_output: false
    allow_emergency_stop_output: false
    require_rc_authorization: true
    rc_flight_flow_enabled: true
    landing_switch_channel: 8
    landing_switch_off_below_pwm: 1200
    landing_switch_on_above_pwm: 1800
    landing_switch_maximum_age_s: 0.5
    land_guided_descent_mps: 0.10
    land_yaw_tolerance_deg: 4.0
    land_yaw_gain_per_s: 0.8
    land_maximum_yaw_rate_deg_s: 15.0
    landing_alignment_maximum_age_s: 0.3
    land_recovery_height_m: 0.10
    land_recovery_timeout_s: 1.0
    land_reacquire_dwell_s: 0.0
    # Migrated from the Pi native-land hardware profile (2026-09-28).
    maximum_horizontal_speed_mps: 0.20
    maximum_horizontal_acceleration_mps2: 0.40
    candidate_maximum_age_s: 1.0
    follow_loss_grace_s: 1.0
    rangefinder_topic: /landing/sensor_range
    mode_retry_s: 1.0
    # FCU heartbeat is normally 1 Hz; this is a v2 freshness setting.
    state_maximum_age_s: 2.0
    ekf_report_topic: /landing/ekf_report
    tone_output_enabled: true
    follow_active_tone_repeat_s: 3.0
    landing_active_tone_repeat_s: 2.0
    tone_mavlink_sink_topic: /uas1/mavlink_sink
    allow_target_echo_request: true
    target_echo_topic: /mavros/setpoint_raw/target_local
    target_echo_message_id: 85
    target_echo_interval_us: 200000.0
    target_echo_timeout_s: 0.5
    target_echo_request_retry_s: 2.0
    rollback_orphaned_guided: true
    orphaned_guided_grace_s: 1.0

landing_target_adapter:
  ros__parameters:
    environment: hardware
    flight_use_approved: true
    allow_landing_target_output: true
