# ros_gz_bridge parameter_bridge 配置：R680 仿真话题桥
# QoS 写法参考 air_ground_sim config/deployment_gazebo_bridge.yaml

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# 仿真电机桥输出的整车速度指令 → gz 阿克曼转向插件
- ros_topic_name: /ugv/sim/cmd_vel
  gz_topic_name: /model/ground_vehicle/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# gz 整车里程计 → 仿真电机桥（反算 /motor_feedback）
- ros_topic_name: /ugv/wheel/odometry
  gz_topic_name: /model/ground_vehicle/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# 360° 激光雷达 → perception_node
- ros_topic_name: /scan
  gz_topic_name: /model/ground_vehicle/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# IMU（备用，当前无消费者）
- ros_topic_name: /imu/data
  gz_topic_name: /model/ground_vehicle/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# 前视相机 → perception_node / web_gateway（lazy：有订阅者才启动渲染）
- ros_topic_name: /camera/image_raw
  gz_topic_name: /model/ground_vehicle/front_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

- ros_topic_name: /camera/camera_info
  gz_topic_name: /model/ground_vehicle/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

# 后视相机 → web_gateway /api/camera_rear.jpg（lazy：有订阅者才启动渲染）
- ros_topic_name: /camera/rear/image_raw
  gz_topic_name: /model/ground_vehicle/rear_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

- ros_topic_name: /camera/rear/camera_info
  gz_topic_name: /model/ground_vehicle/rear_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

# 俯视相机（停机坪正上方）→ web_gateway /api/camera_top.jpg（仿真监控台 /sim 用）
- ros_topic_name: /camera/top/image_raw
  gz_topic_name: /model/ground_vehicle/top_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

- ros_topic_name: /camera/top/camera_info
  gz_topic_name: /model/ground_vehicle/top_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

# 停机坪居中机构：4 个推杆棱柱关节位置指令（q=0 外侧 / -0.057 内侧）
- ros_topic_name: /leadscrew/sim/pusher_a/cmd_pos
  gz_topic_name: /model/ground_vehicle/pusher_a/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /leadscrew/sim/pusher_b/cmd_pos
  gz_topic_name: /model/ground_vehicle/pusher_b/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /leadscrew/sim/pusher_c/cmd_pos
  gz_topic_name: /model/ground_vehicle/pusher_c/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /leadscrew/sim/pusher_d/cmd_pos
  gz_topic_name: /model/ground_vehicle/pusher_d/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# 推杆关节状态回传（调试用：实际位置 vs 指令位置）
- ros_topic_name: /leadscrew/sim/joint_states
  gz_topic_name: /model/ground_vehicle/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
