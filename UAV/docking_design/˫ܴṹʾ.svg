<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#cbd5df"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.48" stop-color="#d9a51d"/>
      <stop offset="1" stop-color="#8b6411"/>
    </linearGradient>
    <linearGradient id="redContact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b6d"/>
      <stop offset="1" stop-color="#d92d20"/>
    </linearGradient>
    <linearGradient id="blueContact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65b7ff"/>
      <stop offset="1" stop-color="#1268c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243342" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#152536" flood-opacity="0.22"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#168f62"/>
    </marker>
    <style>
      .font { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 750; fill: #172536; }
      .subtitle { font-size: 22px; font-weight: 450; fill: #617184; }
      .panel-title { font-size: 26px; font-weight: 700; fill: #1e2c3d; }
      .label { font-size: 19px; font-weight: 600; fill: #25364a; }
      .small { font-size: 16px; font-weight: 500; fill: #526375; }
      .tiny { font-size: 14px; font-weight: 500; fill: #64748b; }
      .callout { fill: #ffffff; stroke: #d8e0e8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>

  <g class="font">
    <text x="70" y="72" class="title">双滑橇起落架：车载固定与接触充电结构</text>
    <text x="72" y="116" class="subtitle">两根现有横杆负责落地承载；金属触电鞋独立安装，碳纤维横杆不参与导电</text>

    <!-- Left card: top view -->
    <rect x="55" y="155" width="1080" height="700" rx="28" fill="#fff" filter="url(#shadow)"/>
    <text x="90" y="205" class="panel-title">A · 俯视图（无人机落在车载平台后）</text>

    <!-- Docking deck -->
    <rect x="145" y="250" width="900" height="525" rx="48" fill="url(#deck)" stroke="#aebbc7" stroke-width="3"/>
    <path d="M175 295 H1015" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

    <!-- Shallow V guide channels shown from top -->
    <rect x="332" y="287" width="94" height="448" rx="38" fill="#9de8c7" opacity="0.62" stroke="#168f62" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="762" y="287" width="94" height="448" rx="38" fill="#9de8c7" opacity="0.62" stroke="#168f62" stroke-width="3" stroke-dasharray="9 7"/>

    <!-- Drone X arms, translucent so dock is visible -->
    <g opacity="0.68">
      <line x1="594" y1="510" x2="287" y2="327" stroke="#66778a" stroke-width="30" stroke-linecap="round"/>
      <line x1="594" y1="510" x2="903" y2="327" stroke="#66778a" stroke-width="30" stroke-linecap="round"/>
      <line x1="594" y1="510" x2="287" y2="698" stroke="#66778a" stroke-width="30" stroke-linecap="round"/>
      <line x1="594" y1="510" x2="903" y2="698" stroke="#66778a" stroke-width="30" stroke-linecap="round"/>
      <circle cx="287" cy="327" r="102" fill="none" stroke="#8291a1" stroke-width="5"/>
      <circle cx="903" cy="327" r="102" fill="none" stroke="#8291a1" stroke-width="5"/>
      <circle cx="287" cy="698" r="102" fill="none" stroke="#8291a1" stroke-width="5"/>
      <circle cx="903" cy="698" r="102" fill="none" stroke="#8291a1" stroke-width="5"/>
      <circle cx="287" cy="327" r="30" fill="#435267"/>
      <circle cx="903" cy="327" r="30" fill="#435267"/>
      <circle cx="287" cy="698" r="30" fill="#435267"/>
      <circle cx="903" cy="698" r="30" fill="#435267"/>
      <rect x="515" y="433" width="158" height="154" rx="28" fill="#2b394b" stroke="#8f9dad" stroke-width="3"/>
    </g>

    <!-- Actual two skid rails -->
    <rect x="353" y="275" width="52" height="472" rx="25" fill="#202b36" stroke="#0c131b" stroke-width="4" filter="url(#smallShadow)"/>
    <rect x="783" y="275" width="52" height="472" rx="25" fill="#202b36" stroke="#0c131b" stroke-width="4" filter="url(#smallShadow)"/>
    <path d="M366 293 V729" stroke="#5d6976" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M796 293 V729" stroke="#5d6976" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <!-- Insulated contact shoes mounted under skid rails -->
    <rect x="342" y="454" width="74" height="126" rx="20" fill="#f5f7f9" stroke="#8c9aa9" stroke-width="3"/>
    <rect x="350" y="467" width="58" height="100" rx="16" fill="url(#redContact)" stroke="#a91f17" stroke-width="3"/>
    <text x="379" y="525" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">＋</text>

    <rect x="772" y="454" width="74" height="126" rx="20" fill="#f5f7f9" stroke="#8c9aa9" stroke-width="3"/>
    <rect x="780" y="467" width="58" height="100" rx="16" fill="url(#blueContact)" stroke="#0d579f" stroke-width="3"/>
    <text x="809" y="525" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">−</text>

    <!-- Locking clamps -->
    <g fill="#168f62" stroke="#0c6d4a" stroke-width="3">
      <path d="M310 362 h35 v58 h-18 v-35 h-17 z"/>
      <path d="M448 362 h-35 v58 h18 v-35 h17 z"/>
      <path d="M740 362 h35 v58 h-18 v-35 h-17 z"/>
      <path d="M878 362 h-35 v58 h18 v-35 h17 z"/>
    </g>

    <!-- Center vision region -->
    <rect x="532" y="448" width="126" height="124" rx="24" fill="#f7f2ff" stroke="#7448b8" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="568" cy="486" r="15" fill="#7448b8"/>
    <circle cx="621" cy="486" r="15" fill="#22a86b"/>
    <text x="595" y="532" text-anchor="middle" class="small" fill="#5c3a8c">IMX296 + MTF-01P</text>
    <text x="595" y="557" text-anchor="middle" class="tiny">向下视野保留区</text>

    <!-- AprilTag marker -->
    <g transform="translate(553 625)">
      <rect width="84" height="84" rx="4" fill="#fff" stroke="#273445" stroke-width="4"/>
      <rect x="8" y="8" width="26" height="26" fill="#111827"/>
      <rect x="50" y="8" width="26" height="26" fill="#111827"/>
      <rect x="8" y="50" width="26" height="26" fill="#111827"/>
      <rect x="39" y="39" width="16" height="16" fill="#111827"/>
      <rect x="58" y="52" width="18" height="24" fill="#111827"/>
    </g>
    <text x="595" y="731" text-anchor="middle" class="small">平台视觉标记</text>

    <!-- Heading key -->
    <path d="M594 292 V233" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>
    <text x="594" y="224" text-anchor="middle" class="label">机头方向</text>
    <path d="M342 305 l37 -26 l37 26" fill="#ffcc65" stroke="#b57b00" stroke-width="3"/>
    <text x="454" y="302" class="small">非对称定位键：防止180°反向落位</text>

    <!-- Callouts -->
    <path d="M351 525 H222 V483" fill="none" stroke="#d92d20" stroke-width="3" marker-end="url(#arrowDark)"/>
    <rect x="90" y="414" width="232" height="69" rx="13" class="callout"/>
    <text x="108" y="442" class="label" fill="#bb241a">左滑橇下方：正极触电鞋</text>
    <text x="108" y="468" class="small">塑料夹座与碳杆绝缘</text>

    <path d="M835 525 H968 V483" fill="none" stroke="#1268c4" stroke-width="3" marker-end="url(#arrowDark)"/>
    <rect x="870" y="414" width="230" height="69" rx="13" class="callout"/>
    <text x="888" y="442" class="label" fill="#1268c4">右滑橇下方：负极触电鞋</text>
    <text x="888" y="468" class="small">对应平台弹性触点</text>

    <rect x="90" y="788" width="1004" height="47" rx="14" fill="#edf8f3" stroke="#9dd8bf"/>
    <text x="111" y="819" class="small" fill="#136d4c">落位逻辑：V形槽横向导正 → 两侧夹爪锁住滑橇 → 检测接触/极性/温度 → 接触器才允许送电</text>

    <!-- Right card: section -->
    <rect x="1160" y="155" width="585" height="700" rx="28" fill="#fff" filter="url(#shadow)"/>
    <text x="1195" y="205" class="panel-title">B · 横向剖面（两根滑橇）</text>
    <text x="1197" y="238" class="small">触点在横杆底部，承力与导电分开</text>

    <!-- Base -->
    <path d="M1215 670 H1690 V753 H1215 Z" fill="#bac6d1" stroke="#7c8c9d" stroke-width="3"/>
    <path d="M1234 670 L1295 525 L1385 525 L1446 670" fill="#dce5ec" stroke="#168f62" stroke-width="4"/>
    <path d="M1460 670 L1521 525 L1611 525 L1672 670" fill="#dce5ec" stroke="#168f62" stroke-width="4"/>

    <!-- Rails -->
    <circle cx="1340" cy="480" r="33" fill="#202b36" stroke="#0c131b" stroke-width="5"/>
    <circle cx="1566" cy="480" r="33" fill="#202b36" stroke="#0c131b" stroke-width="5"/>
    <circle cx="1331" cy="470" r="8" fill="#687787"/>
    <circle cx="1557" cy="470" r="8" fill="#687787"/>

    <!-- Insulator clamps and shoes -->
    <path d="M1307 486 q2 52 33 62 q31 -10 33 -62 l-18 0 q-2 32 -15 37 q-13 -5 -15 -37 z" fill="#f4f6f8" stroke="#8795a5" stroke-width="3"/>
    <rect x="1313" y="531" width="54" height="19" rx="8" fill="url(#redContact)" stroke="#a91f17" stroke-width="3"/>
    <path d="M1533 486 q2 52 33 62 q31 -10 33 -62 l-18 0 q-2 32 -15 37 q-13 -5 -15 -37 z" fill="#f4f6f8" stroke="#8795a5" stroke-width="3"/>
    <rect x="1539" y="531" width="54" height="19" rx="8" fill="url(#blueContact)" stroke="#0d579f" stroke-width="3"/>

    <!-- Spring contacts -->
    <g filter="url(#smallShadow)">
      <rect x="1312" y="558" width="56" height="24" rx="8" fill="url(#metal)" stroke="#72510c" stroke-width="3"/>
      <rect x="1538" y="558" width="56" height="24" rx="8" fill="url(#metal)" stroke="#72510c" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#546576" stroke-width="4">
      <path d="M1320 588 l10 11 l10 -11 l10 11 l10 -11"/>
      <path d="M1546 588 l10 11 l10 -11 l10 11 l10 -11"/>
    </g>
    <rect x="1305" y="604" width="70" height="26" rx="7" fill="#647486"/>
    <rect x="1531" y="604" width="70" height="26" rx="7" fill="#647486"/>

    <!-- Lock hooks -->
    <path d="M1276 490 v-68 h40 v24 h-16 v44" fill="none" stroke="#168f62" stroke-width="16" stroke-linejoin="round"/>
    <path d="M1630 490 v-68 h-40 v24 h16 v44" fill="none" stroke="#168f62" stroke-width="16" stroke-linejoin="round"/>

    <!-- Wires -->
    <path d="M1340 631 V716 H1260" fill="none" stroke="#d92d20" stroke-width="8"/>
    <path d="M1566 631 V716 H1650" fill="none" stroke="#1268c4" stroke-width="8"/>
    <text x="1243" y="721" text-anchor="end" font-size="22" font-weight="800" fill="#d92d20">＋</text>
    <text x="1668" y="721" font-size="24" font-weight="800" fill="#1268c4">−</text>

    <!-- Center camera cone -->
    <path d="M1453 408 L1394 652 H1512 Z" fill="#55d98b" opacity="0.19" stroke="#22a86b" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="1415" y="367" width="76" height="48" rx="12" fill="#6f42b5"/>
    <circle cx="1438" cy="391" r="11" fill="#d9c7f5"/>
    <circle cx="1470" cy="391" r="11" fill="#8ff0bd"/>
    <text x="1453" y="345" text-anchor="middle" class="small">相机/光流向下</text>

    <!-- Numbered labels -->
    <g>
      <circle cx="1215" cy="290" r="18" fill="#243447"/><text x="1215" y="297" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
      <text x="1244" y="297" class="label">碳纤维滑橇横杆（只承力）</text>
      <path d="M1392 292 L1354 454" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>

      <circle cx="1215" cy="328" r="18" fill="#243447"/><text x="1215" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
      <text x="1244" y="335" class="label">绝缘夹座＋金属触电鞋</text>
      <path d="M1422 330 L1362 530" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>

      <circle cx="1215" cy="788" r="18" fill="#243447"/><text x="1215" y="795" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
      <text x="1244" y="795" class="label">平台大电流弹性触点（建议≥15A）</text>

      <circle cx="1215" cy="826" r="18" fill="#243447"/><text x="1215" y="833" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
      <text x="1244" y="833" class="label">夹爪只负责固定，不兼作电极</text>
    </g>

    <!-- Bottom card: electrical path -->
    <rect x="55" y="885" width="1690" height="235" rx="28" fill="#fff" filter="url(#shadow)"/>
    <text x="90" y="930" class="panel-title">C · 两个主触点实际接到哪里</text>

    <g>
      <rect x="90" y="968" width="235" height="83" rx="18" fill="#eaf2fa" stroke="#80a3c4" stroke-width="2"/>
      <text x="207" y="1001" text-anchor="middle" class="label">车端电池 / DC电源</text>
      <text x="207" y="1030" text-anchor="middle" class="small">提供充电输入能量</text>

      <path d="M325 1009 H385" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>

      <rect x="390" y="968" width="260" height="83" rx="18" fill="#edf8f3" stroke="#4daf83" stroke-width="2"/>
      <text x="520" y="1001" text-anchor="middle" class="label">预充＋常开接触器</text>
      <text x="520" y="1030" text-anchor="middle" class="small">默认断电，检测通过后闭合</text>

      <path d="M650 1009 H710" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>

      <rect x="715" y="956" width="220" height="106" rx="18" fill="#fff5f4" stroke="#d92d20" stroke-width="2"/>
      <text x="825" y="992" text-anchor="middle" class="label">平台弹性触点</text>
      <text x="825" y="1022" text-anchor="middle" font-size="22" font-weight="800"><tspan fill="#d92d20">＋</tspan><tspan fill="#64748b"> / </tspan><tspan fill="#1268c4">−</tspan></text>
      <text x="825" y="1048" text-anchor="middle" class="small">接触滑橇金属鞋</text>

      <path d="M935 1009 H995" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>

      <rect x="1000" y="956" width="300" height="106" rx="18" fill="#f7f2ff" stroke="#7448b8" stroke-width="2"/>
      <text x="1150" y="990" text-anchor="middle" class="label">机载充电管理模块</text>
      <text x="1150" y="1018" text-anchor="middle" class="small">恒流/恒压＋单体监测/均衡</text>
      <text x="1150" y="1047" text-anchor="middle" class="small">内部接主线与6S平衡线</text>

      <path d="M1300 1009 H1360" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>

      <rect x="1365" y="968" width="250" height="83" rx="18" fill="#fff7dd" stroke="#d5a52b" stroke-width="2"/>
      <text x="1490" y="1001" text-anchor="middle" class="label">6S 6000mAh 动力电池</text>
      <text x="1490" y="1030" text-anchor="middle" class="small">充电与飞行动力共用电池</text>

      <path d="M1490 1051 V1081 H1662" stroke="#7c8c9d" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowDark)"/>
      <text x="1654" y="1100" text-anchor="end" class="tiny">飞行放电 → 分电板 / 4个电调</text>
    </g>

    <rect x="90" y="1074" width="1120" height="29" rx="10" fill="#fff0ef"/>
    <text x="106" y="1095" class="tiny" fill="#9c271f">重要：两根滑橇只提供正负两路主电；普通6S LiPo若要无人值守充电，仍需机载充电管理连接电芯平衡线。</text>
  </g>
</svg>
