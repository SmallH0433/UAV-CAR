# N10P（串口版）激光雷达配置 —— 供 lslidar_driver（厂商 SDK，src/vendor/lslidar_ros2）使用
# 只保留与厂商默认不同的关键项，其余参数驱动内均有默认值。
# 命名空间 x10 与节点名 lslidar_driver_node 必须与 launch 一致，勿改。

x10:
  lslidar_driver_node:
    ros__parameters:
      lidar_type: "X10"                    # 雷达类型（X10 驱动兼容 N10P）
      lidar_model: "N10Plus"               # N10P
      serial_port: "/dev/wheeltec_lidar"   # udev 规则名（vendor/wheeltec_udev.sh）；
                                           # 未配规则时改为实际 /dev/ttyUSB* / /dev/ttyACM*

      frame_id: "laser_frame"              # 本项目坐标系契约（厂商默认 laser）
      laserscan_topic: "/scan"             # LaserScan 话题（厂商默认即 /scan）

      publish_scan: true                   # 输出 LaserScan
      use_high_precision: true             # 高精度模式（厂商建议 N10 系开启）
      publish_multiecholaserscan: false    # N10P 双回波输出；常规建图导航保持单回波
      N10Plus_hz: 10                       # 扫描频率 [6,12]
      min_range: 0.15                      # 最小量程(m)，小于该值的点被过滤
      max_range: 50.0                      # 最大量程(m)
