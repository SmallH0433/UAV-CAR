uav_mavlink_bridge:
  ros__parameters:
    connection: serial:/dev/serial0
    baud: 57600
    command_topic: /uav/cmd_vel
    odom_topic: /uav/odom
    odom_frame_id: uav_odom
    base_frame_id: uav_base_link
    # Real commands remain disabled until the operator explicitly enables them.
    command_enabled: false
    max_xy_mps: 0.5
    max_z_mps: 0.3
    max_yaw_rate_rps: 0.5
    command_timeout_s: 0.3
    heartbeat_timeout_s: 3.0
    telemetry_stream_max_attempts: 3
    # The real Pixhawk must be commissioned to this policy. The companion reads
    # and verifies values but deliberately has no authority to change them.
    required_parameters_json: '{"ARMING_CHECK": 1.0, "DISARM_DELAY": 5.0}'
    required_parameter_tolerance: 0.001
    parameter_attestation_retry_s: 1.0
    parameter_attestation_period_s: 10.0
    # Physical arming/takeoff remains under pilot / flight-controller policy.
    allow_lifecycle_commands: false
    # Commissioned site mission may selectively override mode/LAND only.
    allow_mode_commands: false
    allow_land_command: false
    takeoff_altitude_m: 2.5

ugv_command_gateway:
  ros__parameters:
    input_topic: /ugv/cmd_vel
    # Remap this if the selected physical chassis driver uses another topic.
    output_topic: /hunter_base/cmd_vel
    command_enabled: false
    max_linear_mps: 0.5
    max_angular_rps: 0.5
    command_timeout_s: 0.3

ugv_control_mux:
  ros__parameters:
    navigation_topic: /cmd_vel
    teleop_topic: /ugv/teleop/cmd_vel
    output_topic: /ugv/control/cmd_vel
    mission_status_topic: /mission/status
    mission_gate_topic: /ugv/mission_gate
    operator_heartbeat_topic: /ugv/operator/heartbeat
    speed_gate_topic: /ugv/speed_scale
    emergency_stop_topic: /system/emergency_stop
    # Explicit commissioning action is required before physical motion.
    command_enabled: false
    command_timeout_s: 0.25
    mission_status_timeout_s: 0.50
    mission_gate_timeout_s: 0.30
    operator_timeout_s: 0.40
    publish_rate_hz: 50.0

system_supervisor:
  ros__parameters:
    source_timeout_s: 1.5
    low_battery_pct: 25.0
    critical_battery_pct: 15.0
    stopped_speed_mps: 0.02
    required_sources_json: '["mission", "mavlink", "perception", "command_mux", "ugv_control_mux", "chassis_adapter", "ugv_gateway", "docking_gateway"]'
    external_estop_topic: /safety/external_estop
    # A safety relay / PLC monitor must publish the healthy (false) heartbeat.
    external_estop_required: true
    external_estop_timeout_s: 0.20
    startup_grace_s: 8.0
    event_log_path: ~/.local/state/air-ground/system-events.jsonl
    event_log_required: true
    auto_abort_mission: true
    critical_fault_hold_s: 0.50
    moving_capture_armed_timeout_s: 12.0
    moving_capture_max_altitude_m: 0.50

vision_input_monitor:
  ros__parameters:
    # The IMX296 driver should publish or be remapped to this common topic.
    image_topic: /vision/image_raw
    stale_after_s: 0.5
    reliable_qos: false

apriltag_tracker:
  ros__parameters:
    image_topic: /vision/image_raw
    command_topic: /uav/follow/cmd_vel
    telemetry_topic: /uav/mavlink/status
    debug_image_topic: /apriltag/debug_image
    tag_id: 0
    # Assign the desired AT9S Pro switch to this receiver channel.
    rc_channel: 7
    rc_enable_pwm: 1700
    # Real takeover must come from the physical RC switch.
    allow_service_enable: false
    min_altitude_m: 1.0
    gain: 0.5
    deadband: 0.08
    max_xy_mps: 0.35
    detection_timeout_s: 0.30
    tag_lost_abort_s: 1.0

uav_command_mux:
  ros__parameters:
    navigation_topic: /uav/nav/cmd_vel
    follow_topic: /uav/follow/cmd_vel
    docking_topic: /uav/docking/cmd_vel
    output_topic: /uav/cmd_vel
    navigation_status_topic: /uav/navigation/status
    follow_status_topic: /apriltag/status
    docking_status_topic: /uav/docking/status
    command_timeout_s: 0.30
    status_timeout_s: 0.7
    command_enabled: true

ugv_chassis_adapter:
  ros__parameters:
    adapter_type: ackermann
    input_topic: /ugv/safety/cmd_vel
    output_topic: /ugv/cmd_vel
    command_enabled: false
    command_timeout_s: 0.25
    publish_rate_hz: 30.0
    max_linear_mps: 0.50
    max_angular_rps: 0.8
    max_linear_accel_mps2: 0.50
    max_angular_accel_rps2: 0.8
    wheelbase_m: 0.650
    max_steering_angle_rad: 0.41
    min_linear_for_turn_mps: 0.03
    require_speed_gate: true
    speed_gate_timeout_s: 0.20
    emergency_stop_topic: /system/emergency_stop

uav_navigation:
  ros__parameters:
    odom_topic: /uav/odom
    scan_topic: /uav/scan
    goal_topic: /uav/nav/goal
    command_topic: /uav/nav/cmd_vel
    telemetry_topic: /uav/mavlink/status
    perception_vector_topic: /uav/perception/avoidance_vector
    perception_status_topic: /uav/perception/status
    command_enabled: false
    require_flight_ready: true
    require_perception: true
    odom_timeout_s: 0.35
    scan_timeout_s: 0.35
    perception_timeout_s: 0.55
    max_xy_mps: 0.6
    max_z_mps: 0.3
    max_yaw_rate_rps: 0.4
    minimum_navigation_altitude_m: 1.0
    maximum_altitude_m: 10.0
    geofence_radius_m: 15.0
    obstacle_influence_distance_m: 3.0
    obstacle_hard_stop_distance_m: 1.2
    obstacle_repulsion_gain: 1.2
    airspace_prediction_horizon_s: 2.0
    airspace_margin_m: 0.35
    no_fly_zones_json: "[]"
    height_limit_zones_json: "[]"

uav_perception:
  ros__parameters:
    # Real drivers are remapped to the same contracts. A stereo driver should
    # publish disparity-derived depth as 32FC1 or 16UC1 here.
    scan_topic: /uav/scan
    pointcloud_topic: /uav/lidar3d/points
    depth_topic: /uav/stereo/depth/depth_image
    range_prefix: /uav/range
    influence_distance_m: 3.5
    hard_stop_distance_m: 1.2
    sensor_stale_after_s: 0.45
    freshness_uses_ros_time: false
    sensor_wall_stale_after_s: 0.55
    point_stride: 2
    depth_stride: 6

uav_gimbal_controller:
  ros__parameters:
    # Remap these outputs to the selected CAN/PWM gimbal driver if it does not
    # implement the common Float64 joint-position contract.
    setpoint_topic: /uav/gimbal/setpoint
    yaw_command_topic: /uav/gimbal/cmd_yaw
    pitch_command_topic: /uav/gimbal/cmd_pitch
    yaw_min_rad: -2.967
    yaw_max_rad: 2.967
    pitch_min_rad: -0.436
    pitch_max_rad: 1.5708
    rate_limit_rad_s: 1.0

uav_docking_controller:
  ros__parameters:
    command_topic: /uav/docking/cmd_vel
    mode_topic: /uav/docking/mode
    uav_odom_topic: /uav/odom
    ugv_pose_topic: /amcl_pose
    ugv_odom_topic: /odometry/filtered
    apriltag_status_topic: /apriltag/status
    perception_status_topic: /uav/perception/status
    approach_altitude_m: 2.8
    follow_altitude_m: 3.0
    follow_distance_m: 2.0
    deck_height_m: 0.39
    capture_altitude_m: 0.68
    max_xy_mps: 0.45
    max_z_mps: 0.20
    max_yaw_rate_rps: 0.30
    coarse_gain: 0.40
    visual_gain: 0.35
    vertical_gain: 0.40
    visual_deadband: 0.05
    descent_rate_mps: 0.10
    tag_timeout_s: 0.8
    pose_timeout_s: 0.45
    capture_error: 0.08
    minimum_capture_tag_area_px: 1800.0

docking_hardware_gateway:
  ros__parameters:
    command_enabled: false
    attach_topic: /uav/dock/attach
    detach_topic: /uav/dock/detach
    lock_command_topic: /dock_hw/lock_command
    contact_a_topic: /dock_hw/contact_a
    contact_b_topic: /dock_hw/contact_b
    locked_a_topic: /dock_hw/locked_a
    locked_b_topic: /dock_hw/locked_b
    emergency_stop_topic: /system/emergency_stop
    feedback_timeout_s: 0.20
    state_timeout_s: 0.50
    operation_timeout_s: 2.0
    startup_grace_s: 8.0
    stationary_speed_limit_mps: 0.02
    moving_speed_limit_mps: 0.12
    moving_yaw_rate_limit_rps: 0.12
    moving_capture_max_altitude_m: 0.50

web_gateway:
  ros__parameters:
    # Bind to loopback; expose only through an authenticated TLS reverse proxy.
    bind_address: 127.0.0.1
    port: 8765
    # Explicitly enable only after configuring auth_token and TLS/reverse proxy.
    command_enabled: false
    auth_token: "CHANGE_ME_BEFORE_ENABLING_COMMANDS"
    cors_origin: "https://ground-station.local"
    # Safe because the gateway binds loopback and only Nginx can reach it.
    trust_proxy_headers: true
    simulation_control_enabled: false
    simulation_world: ""
    camera_max_rate_hz: 4.0
    camera_encoder_threads: 2
    executor_threads: 4
    # Most V4L2/GStreamer ROS camera drivers use sensor-data best effort.
    # Commissioned drivers may override this only after endpoint QoS audit.
    camera_qos_reliability: best_effort
    jpeg_quality: 70
    production_mode: true
    auth_token_env: AIR_GROUND_CONTROL_TOKEN
    require_request_id: true
    require_operator_id: true
    max_request_bytes: 16384
    command_rate_limit_per_minute: 60
    system_health_timeout_s: 1.5
    audit_log_path: ~/.local/state/air-ground/gateway-audit.jsonl
    audit_required: true
    audit_log_max_bytes: 20971520
