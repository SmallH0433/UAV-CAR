name: production-baseline

on:
  push:
  pull_request:

jobs:
  ros2-humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-colcon-common-extensions python3-pip python3-rosdep \
            ros-humble-cv-bridge ros-humble-diagnostic-msgs \
            ros-humble-nav2-bringup ros-humble-nav2-collision-monitor \
            ros-humble-robot-localization ros-humble-ros-gz-bridge \
            ros-humble-sensor-msgs-py
          rosdep init 2>/dev/null || true
          rosdep update
          python3 -m pip install --no-cache-dir -r requirements.txt pytest pyyaml
      - name: Verify production-safe defaults
        shell: bash
        run: python3 scripts/verify_production_baseline.py
      - name: Build and test ROS package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p /tmp/air_ground_ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/air_ground_ws/src/air_ground_sim
          cd /tmp/air_ground_ws
          rosdep install --from-paths src --ignore-src -r -y
          colcon build --event-handlers console_direct+
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  operations-console:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web_ground_station
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_ground_station/package-lock.json
      - run: npm ci
      - run: npm run check:compat
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
