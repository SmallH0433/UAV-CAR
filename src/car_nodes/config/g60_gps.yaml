# WHEELTEC G60 GPS 配置 —— 供 nmea_navsat_driver（厂商 SDK，src/vendor/wheeltec_gps）使用
# 节点名 nmea_serial_driver 必须与 launch 一致，勿改。

nmea_serial_driver:
  ros__parameters:
    port: "/dev/wheeltec_gps"   # udev 规则名（vendor/wheeltec_gps/wheeltec_udev.sh）；
                                # 未配规则时改为实际 /dev/ttyUSB* / /dev/ttyACM*
    baud: 9600                  # G60 出厂波特率（手册明示）
    frame_id: "gps"             # NavSatFix 为全球坐标不依赖 TF；URDF gps_link 待定位融合时再补
    time_ref_source: "gps"      # /time_reference 以 GPS 时间为源
    useRMC: false               # 定位用 GGA；RMC 仅速度/航向需要时再开
