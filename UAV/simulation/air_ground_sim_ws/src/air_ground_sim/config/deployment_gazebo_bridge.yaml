  qos_profile: SENSOR_DATA

# Docking latch commands. The Boolean reports the detachable state (true means
# detached). A real latch driver implements the same ROS-facing contract.
- ros_topic_name: /uav/dock/detach
  gz_topic_name: /uav/dock/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /uav/dock/attach
  gz_topic_name: /uav/dock/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /uav/dock/detached
  gz_topic_name: /uav/dock/detached
  # Gazebo Harmonic 8 publishes the literal states "attached" / "detached".
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
