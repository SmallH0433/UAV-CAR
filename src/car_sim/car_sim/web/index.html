<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R680 仿真遥控</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #14171c; color: #d7dde6;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
  }
  .panel {
    background: #1d222b; border: 1px solid #2c3442; border-radius: 10px;
    padding: 16px; min-width: 300px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: #8fa3bf; }
  #pad { display: grid; grid-template-columns: repeat(3, 72px); grid-auto-rows: 56px; gap: 8px; justify-content: center; }
  #pad button {
    font-size: 20px; border: 1px solid #3b4a63; border-radius: 8px;
    background: #273142; color: #e6ecf5; cursor: pointer; user-select: none;
    touch-action: none;
  }
  #pad button:active, #pad button.active { background: #3f6db3; }
  #pad .stop { background: #5a2730; }
  #pad .stop:active { background: #a03a48; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
  .row span:last-child { font-family: Consolas, monospace; color: #9fd3a8; }
  #conn.bad { color: #e08080; }
  .cams { display: flex; gap: 8px; }
  .cam { width: 320px; height: 180px; background: #000; border-radius: 6px; display: block; }
  .cam-label { font-size: 12px; color: #7486a0; margin: 6px 0 4px; }
  .hint { font-size: 12px; color: #7486a0; margin-top: 10px; line-height: 1.6; }
  .slider-row { margin-top: 10px; font-size: 13px; }
  input[type=range] { width: 100%; }
  #cruiseBtn {
    width: 100%; padding: 8px 0; font-size: 15px; border: 1px solid #3b4a63;
    border-radius: 8px; background: #273142; color: #e6ecf5; cursor: pointer;
  }
  #cruiseBtn.on { background: #2e7d46; border-color: #3da35f; }
  #cruiseBtn.off { background: #273142; }
  #cruiseBtn.na { background: #3a3a32; color: #8a8a7a; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="panel">
    <h1>R680 仿真遥控</h1>
    <div id="pad">
      <span></span>
      <button data-cmd="forward" title="W / ↑">▲</button>
      <span></span>
      <button data-cmd="left" title="A / ←">◀</button>
      <button class="stop" data-cmd="stop" title="空格">■</button>
      <button data-cmd="right" title="D / →">▶</button>
      <span></span>
      <button data-cmd="backward" title="S / ↓">▼</button>
      <span></span>
    </div>
    <div class="slider-row">
      线速度 <span id="linLabel">0.30</span> m/s
      <input type="range" id="lin" min="0.05" max="0.50" step="0.05" value="0.30">
    </div>
    <div class="slider-row">
      角速度 <span id="angLabel">0.50</span> rad/s
      <input type="range" id="ang" min="0.10" max="0.70" step="0.05" value="0.50">
    </div>
    <div class="slider-row">
      <button id="cruiseBtn" class="cruise" title="自动避障定速巡航">开启巡航</button>
      <span class="hint" style="margin-top:4px">开启后小车自主巡航避障；巡航中按住 A/D 可保持巡航速度手动调整方向（W/S 直接接管速度），松手恢复自主避障</span>
    </div>
    <div class="hint">
      键盘：WASD / 方向键，按住行驶，可组合（W+A 弧线转弯），松开或空格停车。<br>
      阿克曼底盘不能原地自旋：单独按 A/D 只会原地预打方向，叠加 W/S 才会转弯。<br>
      指令 ~10Hz 持续发送；网关 350ms 看门狗会自动停车。
    </div>
  </div>

  <div class="panel">
    <h2>状态</h2>
    <div class="row"><span>连接</span><span id="conn" class="bad">断开</span></div>
    <div class="row"><span>位姿 x / y / yaw</span><span id="pose">-</span></div>
    <div class="row"><span>速度</span><span id="speed">-</span></div>
    <div class="row"><span>控制权</span><span id="authority">-</span></div>
    <div class="row"><span>mux 原因</span><span id="reason">-</span></div>
    <div class="row"><span>网关输出 v / w</span><span id="gw">-</span></div>
    <h2 style="margin-top:14px">相机</h2>
    <div class="cams">
      <div>
        <div class="cam-label">前视</div>
        <img id="camera" class="cam" alt="front camera">
      </div>
      <div>
        <div class="cam-label">后视</div>
        <img id="camera_rear" class="cam" alt="rear camera">
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var linInput = document.getElementById("lin");
  var angInput = document.getElementById("ang");
  var linLabel = document.getElementById("linLabel");
  var angLabel = document.getElementById("angLabel");
  linInput.oninput = function () { linLabel.textContent = Number(linInput.value).toFixed(2); };
  angInput.oninput = function () { angLabel.textContent = Number(angInput.value).toFixed(2); };

  // 定速巡航开关（自动避障验证）
  var cruiseBtn = document.getElementById("cruiseBtn");
  var cruiseOn = false, cruiseAvail = false;
  function renderCruise() {
    if (!cruiseAvail) { cruiseBtn.textContent = "巡航不可用（避障节点离线）"; cruiseBtn.className = "na"; return; }
    cruiseBtn.textContent = cruiseOn ? "■ 关闭巡航（巡航中）" : "▶ 开启巡航";
    cruiseBtn.className = cruiseOn ? "on" : "off";
  }
  cruiseBtn.addEventListener("click", function () {
    if (!cruiseAvail) { return; }
    fetch("/api/ugv/cruise", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enable: !cruiseOn })
    }).then(function (r) { return r.json(); }).then(function (resp) {
      if (resp.accepted) { cruiseOn = !cruiseOn; renderCruise(); }
    }).catch(function () { /* 状态轮询会纠正显示 */ });
  });
  renderCruise();

  // 组合按键状态：阿克曼转向需要 v 与 ω 同时下发（弧线行驶），
  // 因此 W/S 与 A/D 可叠加，而不是单指令互斥。
  var keys = { forward: false, backward: false, left: false, right: false };
  var sendTimer = null;

  function currentCmd() {
    var lin = 0, ang = 0;
    if (keys.forward) { lin += Number(linInput.value); }
    if (keys.backward) { lin -= Number(linInput.value); }
    if (keys.left) { ang += Number(angInput.value); }
    if (keys.right) { ang -= Number(angInput.value); }
    return { linear: lin, angular: ang };
  }

  function anyActive() {
    return keys.forward || keys.backward || keys.left || keys.right;
  }

  function sendOnce(cmd) {
    fetch("/api/ugv/teleop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cmd)
    }).catch(function () { /* 状态轮询会反映连接状态 */ });
  }

  function refreshSending() {
    if (anyActive()) {
      if (!sendTimer) {
        sendOnce(currentCmd());
        sendTimer = setInterval(function () { sendOnce(currentCmd()); }, 100);
      }
    } else if (sendTimer) {
      clearInterval(sendTimer);
      sendTimer = null;
      sendOnce({ linear: 0, angular: 0 });
    }
  }

  function press(name, on) {
    keys[name] = on;
    var button = document.querySelector('#pad button[data-cmd="' + name + '"]');
    if (button) { button.classList.toggle("active", on); }
    refreshSending();
  }

  function stopCommand() {
    keys.forward = keys.backward = keys.left = keys.right = false;
    document.querySelectorAll("#pad button").forEach(function (b) { b.classList.remove("active"); });
    refreshSending();
  }

  document.querySelectorAll("#pad button").forEach(function (button) {
    var name = button.dataset.cmd;
    button.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      if (name === "stop") { stopCommand(); sendOnce({ linear: 0, angular: 0 }); return; }
      press(name, true);
    });
    button.addEventListener("pointerup", function () {
      if (name !== "stop") { press(name, false); }
    });
    button.addEventListener("pointerleave", function () {
      if (name !== "stop" && keys[name]) { press(name, false); }
    });
  });

  var KEYMAP = {
    KeyW: "forward", ArrowUp: "forward",
    KeyS: "backward", ArrowDown: "backward",
    KeyA: "left", ArrowLeft: "left",
    KeyD: "right", ArrowRight: "right"
  };
  document.addEventListener("keydown", function (event) {
    if (event.repeat) { return; }
    if (event.code === "Space") { event.preventDefault(); stopCommand(); sendOnce({ linear: 0, angular: 0 }); return; }
    var name = KEYMAP[event.code];
    if (name) {
      event.preventDefault();
      press(name, true);
    }
  });
  document.addEventListener("keyup", function (event) {
    var name = KEYMAP[event.code];
    if (name) { press(name, false); }
  });
  window.addEventListener("blur", stopCommand);

  // 状态轮询（2Hz）
  var conn = document.getElementById("conn");
  function pollStatus() {
    fetch("/api/status").then(function (resp) { return resp.json(); }).then(function (s) {
      conn.textContent = "已连接";
      conn.classList.remove("bad");
      var pose = s.odom && s.odom.pose;
      document.getElementById("pose").textContent = pose
        ? pose[0].toFixed(2) + " / " + pose[1].toFixed(2) + " / " + pose[2].toFixed(2)
        : "-";
      document.getElementById("speed").textContent =
        s.odom ? s.odom.speed_mps.toFixed(2) + " m/s" : "-";
      var mux = s.ugv_control_mux || {};
      document.getElementById("authority").textContent = mux.authority || "-";
      document.getElementById("reason").textContent = mux.reason || "-";
      var gw = s.ugv_command_gateway || {};
      document.getElementById("gw").textContent =
        (gw.output_linear_mps !== undefined)
          ? gw.output_linear_mps.toFixed(2) + " / " + gw.output_angular_rps.toFixed(2)
          : "-";
      var av = s.avoidance || {};
      cruiseAvail = !!av.available;
      if (av.cruise_enabled !== null && av.cruise_enabled !== undefined) {
        cruiseOn = !!av.cruise_enabled;
      }
      renderCruise();
    }).catch(function () {
      conn.textContent = "断开";
      conn.classList.add("bad");
    });
  }
  pollStatus();
  setInterval(pollStatus, 500);

  // 相机刷新（约 4Hz，附带随机参数防缓存）
  var camera = document.getElementById("camera");
  var cameraRear = document.getElementById("camera_rear");
  setInterval(function () {
    var t = Date.now();
    camera.src = "/api/camera.jpg?t=" + t;
    cameraRear.src = "/api/camera_rear.jpg?t=" + t;
  }, 250);
})();
</script>
</body>
</html>
