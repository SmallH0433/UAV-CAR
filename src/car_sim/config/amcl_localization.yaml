amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5

    # N10P has dense 360-degree scans. More beams/particles make a global
    # search on an already-built map much less likely to settle on a
    # geometrically similar but wrong corridor.
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.20
    laser_max_range: 12.0
    max_beams: 120
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    sigma_hit: 0.18
    lambda_short: 0.10
    z_hit: 0.65
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.25

    min_particles: 1000
    max_particles: 5000
    pf_err: 0.03
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Small thresholds keep the pose responsive at the car's low speed.
    # The web gateway also requests no-motion updates during global search.
    update_min_d: 0.05
    update_min_a: 0.05
    save_pose_rate: 1.0
    set_initial_pose: false
    always_reset_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, amcl]
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
